<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1055">
<title>El mundo de Alina</title>
<style>
  :root { --bg1:#2b1055; --bg2:#7597de; --card:rgba(255,255,255,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff; }
  body { background: linear-gradient(160deg, var(--bg1), var(--bg2)); overflow:hidden; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); }
  .screen.active { display:flex; }

  /* Inicio */
  h1 { font-size:1.9rem; text-align:center; margin:12px 0 4px; }
  .sub { text-align:center; opacity:.85; margin:0 0 22px; }
  .cards { display:flex; flex-direction:column; gap:14px; flex:1; justify-content:center; }
  .card { display:flex; align-items:center; gap:16px; background:var(--card); border:2px solid rgba(255,255,255,.25);
          border-radius:22px; padding:16px; color:#fff; font:inherit; text-align:left; width:100%; cursor:pointer; }
  .card:active { transform:scale(.98); }
  .avatar-sm { width:68px; height:68px; border-radius:50%; display:grid; place-items:center; font-size:2.2rem; flex:none; }
  .card b { font-size:1.25rem; display:block; }
  .card span { opacity:.85; font-size:.95rem; }

  /* Llamada */
  #call { align-items:center; text-align:center; }
  .topbar { width:100%; display:flex; justify-content:space-between; align-items:center; font-size:.95rem; opacity:.9; }
  .stage { flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
  .ring { width:min(62vw,260px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
          font-size:min(26vw,110px); position:relative; }
  .ring::after { content:""; position:absolute; inset:-12px; border-radius:50%; border:3px solid rgba(255,255,255,.5);
                 animation:pulse 1.6s ease-out infinite; }
  .talking .ring { animation:bob 1s ease-in-out infinite; }
  @keyframes pulse { from { transform:scale(.95); opacity:.9; } to { transform:scale(1.25); opacity:0; } }
  @keyframes bob { 50% { transform:translateY(-6px); } }
  #callName { font-size:1.7rem; font-weight:700; }
  #callStatus { opacity:.85; }
  .bubble { background:rgba(255,255,255,.95); color:#2b1055; border-radius:18px; padding:12px 16px; max-width:92%; font-size:1.05rem; }
  .controls { display:flex; gap:22px; align-items:center; justify-content:center; padding-top:8px; }
  .btn { width:64px; height:64px; border-radius:50%; border:none; font-size:1.7rem; cursor:pointer; color:#fff; background:rgba(255,255,255,.22); }
  .btn:active { transform:scale(.94); }
  .btn.end { background:#e53935; width:72px; height:72px; }
  .btn.mic.on { background:#43a047; }
  .label { font-size:.75rem; opacity:.8; margin-top:6px; display:block; }
  .ctl { text-align:center; }
</style>
</head>
<body>

<!-- PANTALLA DE INICIO -->
<section id="home" class="screen active">
  <h1>✨ El mundo de Alina ✨</h1>
  <p class="sub">¿Con quién querés hablar hoy?</p>
  <div class="cards" id="cards"></div>
</section>

<!-- PANTALLA DE VIDEOLLAMADA -->
<section id="call" class="screen">
  <div class="topbar"><span>📹 Videollamada</span><span id="timer">00:00</span></div>
  <div class="stage" id="stage">
    <div class="ring" id="callAvatar"></div>
    <div id="callName"></div>
    <div id="callStatus">Llamando…</div>
    <div class="bubble" id="callBubble" style="display:none"></div>
  </div>
  <div class="controls">
    <div class="ctl"><button class="btn mic" id="micBtn" aria-label="Micrófono">🎤</button><span class="label">Hablar</span></div>
    <div class="ctl"><button class="btn end" id="endBtn" aria-label="Finalizar">📞</button><span class="label">Cortar</span></div>
    <div class="ctl"><button class="btn" id="switchBtn" aria-label="Cambiar personaje">🔄</button><span class="label">Cambiar</span></div>
  </div>
</section>

<script>
  // Personajes (por ahora con íconos de reemplazo; después ponemos las imágenes)
  const personajes = [
    { id:"ladybug", nombre:"Ladybug", emoji:"🐞", color:"linear-gradient(135deg,#e53935,#ff8a80)",
      desc:"Valiente, inteligente y cariñosa", saludo:"¡Hola, Alina! ¡Qué alegría verte! ¿Lista para una aventura?" },
    { id:"catnoir", nombre:"Cat Noir", emoji:"🐱", color:"linear-gradient(135deg,#212121,#6a1b9a)",
      desc:"Divertido, bromista y entusiasta", saludo:"¡Hola, Alina! Tengo un chiste nuevo… ¿querés oírlo?" },
    { id:"tikki", nombre:"Tikki", emoji:"✨", color:"linear-gradient(135deg,#ff7043,#ffcc80)",
      desc:"Dulce, tierna y sabia", saludo:"¡Hola, Alina! Me encanta que hablemos. ¿Cómo fue tu día?" }
  ];

  const $ = id => document.getElementById(id);
  let actual = null, segundos = 0, reloj = null;

  function mostrar(id){ document.querySelectorAll(".screen").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); }

  // Tarjetas de inicio
  personajes.forEach(p => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<div class="avatar-sm" style="background:${p.color}">${p.emoji}</div><div><b>${p.nombre}</b><span>${p.desc}</span></div>`;
    b.onclick = () => llamar(p);
    $("cards").appendChild(b);
  });

  function llamar(p){
    actual = p;
    $("callAvatar").style.background = p.color;
    $("callAvatar").textContent = p.emoji;
    $("callName").textContent = p.nombre;
    $("callStatus").textContent = "Llamando…";
    $("callBubble").style.display = "none";
    $("stage").classList.remove("talking");
    $("micBtn").classList.remove("on");
    mostrar("call");
    segundos = 0; $("timer").textContent = "00:00";
    clearInterval(reloj);
    setTimeout(() => {
      $("callStatus").textContent = "Conectada";
      $("callBubble").textContent = p.saludo;
      $("callBubble").style.display = "block";
      $("stage").classList.add("talking");
      reloj = setInterval(() => {
        segundos++;
        const m = String(Math.floor(segundos/60)).padStart(2,"0"), s = String(segundos%60).padStart(2,"0");
        $("timer").textContent = m + ":" + s;
      }, 1000);
    }, 1500);
  }

  function colgar(){ clearInterval(reloj); mostrar("home"); }

  $("endBtn").onclick = colgar;
  $("switchBtn").onclick = colgar;
  $("micBtn").onclick = () => $("micBtn").classList.toggle("on");  // por ahora solo visual
</script>
</body>
</html>
