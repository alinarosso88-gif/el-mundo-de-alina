<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1055">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>El mundo de Alina</title>
<style>
  :root { --bg1:#2b1055; --bg2:#7597de; --card:rgba(255,255,255,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff; }
  body { background: linear-gradient(160deg, var(--bg1), var(--bg2)); overflow:hidden; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .screen.active { display:flex; }
  button { font-family:inherit; }

  /* Inicio */
  h1 { font-size:1.9rem; text-align:center; margin:12px 0 4px; }
  .sub { text-align:center; opacity:.85; margin:0 0 22px; }
  .cards { display:flex; flex-direction:column; gap:14px; flex:1; justify-content:center; }
  .card { display:flex; align-items:center; gap:16px; background:var(--card); border:2px solid rgba(255,255,255,.25);
          border-radius:22px; padding:16px; color:#fff; font:inherit; text-align:left; width:100%; cursor:pointer; }
  .card:active { transform:scale(.98); }
  .avatar-sm { width:68px; height:68px; border-radius:50%; display:grid; place-items:center; font-size:2.2rem; flex:none; }
  .avatar-sm.small { width:52px; height:52px; font-size:1.6rem; }
  .pic { width:100%; height:100%; border-radius:50%; overflow:hidden; display:grid; place-items:center; }
  .pic img { width:100%; height:100%; object-fit:cover; object-position:50% 0%; }
  .card b { font-size:1.25rem; display:block; }
  .card span { opacity:.85; font-size:.95rem; }

  /* Sala del personaje */
  #hub { align-items:center; text-align:center; }
  .topbar { width:100%; display:flex; justify-content:space-between; align-items:center; font-size:.95rem; opacity:.9; }
  .stage { width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0; }
  .ring { width:min(40vw,170px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font-size:min(18vw,76px); position:relative; }
  .ring::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:3px solid rgba(255,255,255,.5); animation:pulse 1.6s ease-out infinite; }
  .talking .ring { animation:bob 1s ease-in-out infinite; }
  @keyframes pulse { from { transform:scale(.95); opacity:.9; } to { transform:scale(1.25); opacity:0; } }
  @keyframes bob { 50% { transform:translateY(-6px); } }
  #callName { font-size:1.5rem; font-weight:700; }
  #callStatus { opacity:.85; font-size:.95rem; }
  .bubble { background:rgba(255,255,255,.95); color:#2b1055; border-radius:18px; padding:12px 16px; width:100%; font-size:1.05rem; text-align:center; }
  #menuJuegos { display:none; flex-direction:column; gap:10px; width:100%; margin-top:8px; }
  .gamebtn { display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid rgba(255,255,255,.3); border-radius:18px;
             padding:14px 16px; color:#fff; font-size:1.15rem; font-weight:600; width:100%; text-align:left; cursor:pointer; }
  .gamebtn small { display:block; font-weight:400; opacity:.85; font-size:.85rem; }
  .gamebtn .ico { font-size:1.8rem; }
  .gamebtn:active { transform:scale(.98); }
  .controls { display:flex; gap:22px; align-items:center; justify-content:center; padding-top:14px; margin-top:auto; }
  .btn { width:56px; height:56px; border-radius:50%; border:none; font-size:1.5rem; cursor:pointer; color:#fff; background:rgba(255,255,255,.22); }
  .btn:active { transform:scale(.94); }
  .btn.end { background:#e53935; width:62px; height:62px; }
  .btn.off { opacity:.45; }
  .label { font-size:.72rem; opacity:.8; margin-top:4px; display:block; }
  .ctl { text-align:center; }

  /* Juegos */
  #game { gap:12px; }
  .gh { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .back { background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:999px; padding:10px 16px; font-size:1rem; cursor:pointer; }
  #gBubble { font-size:1rem; padding:10px 14px; }
  #gameBody { flex:1; display:flex; flex-direction:column; gap:12px; }
  .info { text-align:center; margin:0; opacity:.9; }
  .grid { display:grid; gap:10px; }
  .carta { aspect-ratio:1; border-radius:16px; border:2px solid rgba(255,255,255,.3); background:rgba(255,255,255,.18); color:#fff;
           padding:0; font-size:2rem; cursor:pointer; position:relative; overflow:hidden; display:grid; place-items:center; }
  .carta .frente { display:none; width:100%; height:100%; place-items:center; font-size:2.3rem; padding:6px; }
  .carta.abierta .frente, .carta.par .frente { display:grid; }
  .carta.abierta .dorso, .carta.par .dorso { display:none; }
  .carta.par { background:rgba(76,175,80,.4); border-color:#81c784; }
  .q { font-size:1.35rem; font-weight:700; text-align:center; margin:6px 0 0; }
  .seq { font-size:2rem; text-align:center; letter-spacing:.05em; background:rgba(255,255,255,.14); border-radius:16px; padding:14px 8px; line-height:1.5; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .opt { background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.35); color:#fff; border-radius:16px; padding:16px; font-size:1.3rem; font-weight:600; cursor:pointer; }
  .opt:active { transform:scale(.98); }
  .opt.ok { background:#43a047; border-color:#a5d6a7; }
  .opt.no { background:#e53935; border-color:#ef9a9a; opacity:.7; }
  .opt:disabled { cursor:default; }
  .gbtn { background:#ffca28; color:#2b1055; border:none; border-radius:16px; padding:16px; font-size:1.15rem; font-weight:700; cursor:pointer; width:100%; }
  .gbtn.sec { background:rgba(255,255,255,.2); color:#fff; }
  .final { text-align:center; display:flex; flex-direction:column; gap:12px; align-items:stretch; padding-top:10px; }
  .final h2 { margin:0; font-size:1.6rem; }
  .final p { margin:0; font-size:1.1rem; }
  .trofeo { width:96px; height:96px; margin:0 auto; }
  .dib { width:100%; height:100%; display:block; overflow:visible; }
  .gamebtn .ico { width:48px; height:48px; flex:0 0 48px; display:grid; place-items:center; }
  .anim .dib { animation: flota 2.8s ease-in-out infinite; }
  .gamebtn:nth-child(2n) .anim .dib { animation-delay:-1s; } .gamebtn:nth-child(3n) .anim .dib { animation-delay:-1.8s; }
  .alas { transform-box:fill-box; transform-origin:50% 50%; animation: aletea .55s ease-in-out infinite alternate; }
  .llama { animation: llama .25s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 0; }
  .carta .dib { width:72%; height:72%; margin:auto; }
  .carta .dorso { display:grid; place-items:center; width:100%; height:100%; }
  .carta.par .dib { animation: salta .8s ease-in-out infinite; }
  .carita { display:inline-block; width:1.5em; height:1.5em; vertical-align:middle; }
  @keyframes flota { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-4px) rotate(2deg); } }
  @keyframes aletea { from { transform:scaleX(1); } to { transform:scaleX(.7); } }
  @keyframes llama { from { transform:scaleY(.8); } to { transform:scaleY(1.15); } }
  @keyframes salta { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px) scale(1.06); } }
  .marcador { display:flex; justify-content:space-between; gap:10px; background:rgba(255,255,255,.16); border-radius:14px; padding:10px 14px; font-size:1.05rem; }
  .marcador b { font-size:1.3rem; }
  #instalarBtn { display:none; margin:18px auto 0; background:#ffca28; color:#2b1055; border:none; border-radius:999px; padding:14px 22px; font-size:1.05rem; font-weight:700; cursor:pointer; }
  #instalarAyuda { display:none; text-align:center; font-size:.9rem; opacity:.9; margin:14px 8px 0; }
</style>
</head>
<body>

<!-- INICIO: elegir personaje -->
<section id="home" class="screen active">
  <h1>✨ El mundo de Alina ✨</h1>
  <p class="sub">¿Con quién querés jugar hoy?</p>
  <div class="cards" id="cards"></div>
  <button id="instalarBtn">📲 Instalar como app</button>
  <p id="instalarAyuda">Para instalarla: tocá los tres puntitos de arriba a la derecha del navegador y elegí “Agregar a la pantalla principal” o “Instalar app”.</p>
</section>

<!-- SALA DEL PERSONAJE: saludo y menú de juegos -->
<section id="hub" class="screen">
  <div class="topbar"><button class="back" id="hubBack" aria-label="Volver">← Volver</button><span id="hubHint"></span></div>
  <div class="stage" id="stage">
    <div class="ring" id="callAvatar"></div>
    <div id="callName"></div>
    <div id="callStatus">Preparándose…</div>
    <div class="bubble" id="callBubble" style="display:none"></div>
  </div>
  <div id="menuJuegos">
    <button class="gamebtn" id="jMemoria"><span class="ico">🃏</span><span>Memoria<small>Encontrá las parejas</small></span></button>
    <button class="gamebtn" id="jQuiz"><span class="ico">❓</span><span>Preguntas y respuestas<small>Mostrá lo que sabés</small></span></button>
    <button class="gamebtn" id="jLogica"><span class="ico">🧩</span><span>Misiones de lógica<small>Resolvé los desafíos</small></span></button>
    <button class="gamebtn" id="jError"><span class="ico">🔍</span><span>¿Qué está mal?<small>Descubrí el error del dibujo</small></span></button>
    <button class="gamebtn" id="jNumeros"><span class="ico">🔢</span><span>Números escondidos<small>Encontralos en orden</small></span></button>
    <button class="gamebtn" id="jPurificar"><span class="ico">🦋</span><span>Purificá al villano<small>Resolvé cuentas y ayudalo</small></span></button>
    <button class="gamebtn" id="jQuien"><span class="ico">🕵️</span><span>¿Quién fue?<small>Un caso difícil de detective</small></span></button>
    <button class="gamebtn" id="jMision"><span class="ico">🐞</span><span>Misión de Ladybug<small>Una aventura por etapas</small></span></button>
    <button class="gamebtn" id="jAkuma"><span class="ico">🦋</span><span>Atrapá la akuma<small>Ayudá y purificá</small></span></button>
    <button class="gamebtn" id="jAdivinanzas"><span class="ico">🐱</span><span>Adivinanzas<small>Pensá y adiviná</small></span></button>
    <button class="gamebtn" id="jGalletitas"><span class="ico">🍪</span><span>Las galletitas de Tikki<small>Contá y sumá galletitas</small></span></button>
  </div>
  <div class="controls">
    <div class="ctl"><button class="btn" id="vozBtn" aria-label="Sonido">🔊</button><span class="label">Sonido</span></div>
    <div class="ctl"><button class="btn" id="cambiaVozBtn" aria-label="Cambiar voz">🎙️</button><span class="label">Cambiar voz</span></div>
    <div class="ctl"><button class="btn end" id="endBtn" aria-label="Salir">🏠</button><span class="label">Salir</span></div>
    <div class="ctl"><button class="btn" id="switchBtn" aria-label="Cambiar personaje">🔄</button><span class="label">Cambiar</span></div>
  </div>
</section>

<!-- JUEGO -->
<section id="game" class="screen">
  <div class="gh">
    <button class="back" id="backBtn">← Volver</button>
    <div class="avatar-sm small" id="gAvatar"></div>
  </div>
  <div class="bubble" id="gBubble"></div>
  <div id="gameBody"></div>
</section>

<script>
  // ---------- Personajes ----------
  // Las imágenes (ladybug.png, catnoir.png, tikki.png) están en la raíz del repositorio.
  const personajes = [
    { id:"ladybug",
      vs:{ elegir:"¿Querés jugar sola o jugamos juntas?", turnoA:"¡Te toca, Alina!", turnoP:"Ahora me toca a mí.",
        yoOk:["¡Yo también acerté!","¡Esta me salió bien!"], yoMal:["Uy, esta no me salió.","¡Me equivoqué esta vez!"],
        par:["¡Encontré una pareja!","¡Esta la tenía!"], nopar:["Uy, no eran iguales.","Casi, casi."],
        ganaA:"¡Ganaste, Alina! Fue una gran partida.", empate:"¡Empatamos! Somos un gran equipo.",
        ganaP:"¡Esta vez gané yo! Pero jugás genial, la próxima seguro ganás." }, img:"ladybug.png", zoom:1.9, origen:"50% 12%", nombre:"Ladybug", emoji:"🐞",
      color:"linear-gradient(135deg,#e53935,#ff8a80)", desc:"Valiente, inteligente y cariñosa",
      pitch:1.15, rate:0.92,
      saludo:"¡Hola, Alina! ¡Qué alegría verte! ¿A qué jugamos hoy?",
      menu:["¿A qué jugamos ahora?","¡Elegí otro juego, Alina!"],
      intro:{ akuma:"¡Una akuma akumatizó a unas personas! Primero tenemos que ayudarlas a calmarse, y después capturar la mariposa oscura. ¡Vamos!", mision:"¡Esta es una misión de heroína! Hay que cruzar seis lugares de la ciudad. En cada uno hay un desafío. ¡Vamos a atrapar a la mariposa oscura!", purificar:"Un villano akumatizado necesita ayuda. Resolvé las cuentas para purificarlo, como hacemos en la ciudad.", quien:"Una mariposa oscura se escondió. Tenés que descubrir sobre quién se posó. ¡Este caso es difícil, pensalo bien!", numeros:"Hay nueve números escondidos. Buscá el uno, después el dos, y así en orden. ¡Si te equivocás, hay que empezar de nuevo!", error:"¡Una misión de detective! Mirá bien cada dibujo y descubrí qué está mal.", memoria:"¡Vamos a poner a prueba tu memoria! Encontrá las parejas.",
              quiz:"¡Una misión de preguntas! Estoy segura de que sabés muchas respuestas.",
              logica:"¡Misiones de lógica! Tenés que descubrir qué sigue. ¡Vos podés!" },
      frases:{ ok:["¡Excelente, Alina!","¡Lo lograste!","¡Qué inteligente sos!"],
               mal:["¡Casi! Probá otra vez, vos podés.","Todavía no, pero seguro lo descubrís."],
               fin:["¡Misión cumplida, Alina! Sos una gran heroína.","¡Qué bien jugaste! Estoy muy orgullosa de vos."] } },
    { id:"catnoir",
      vs:{ elegir:"¿Jugás sola o te animás a jugar contra mí?", turnoA:"¡Tu turno, Alina!", turnoP:"¡Mi turno! Ojo de gato.",
        yoOk:["¡Miau! Esta también la acerté.","¡Eso fue fácil para un gato!"], yoMal:["¡Uy! Hasta los gatos fallan.","Esta me salió mal, ¡qué torpe!"],
        par:["¡Una pareja para el gato!","¡Miau, la encontré!"], nopar:["Uy, no eran iguales.","Falló el salto."],
        ganaA:"¡Ganaste, Alina! Me ganaste con astucia.", empate:"¡Empate! Estamos a la par.",
        ganaP:"¡Miau, gané! Pero casi me alcanzás. ¿Revancha?" }, img:"catnoir.png", zoom:1.9, origen:"50% 12%", nombre:"Cat Noir", emoji:"🐱",
      color:"linear-gradient(135deg,#212121,#6a1b9a)", desc:"Divertido, bromista y entusiasta",
      pitch:0.9, rate:0.98,
      saludo:"¡Hola, Alina! Estoy listo para divertirnos. ¿A qué jugamos?",
      menu:["¿Qué juego sigue, Alina?","¡Elegí otro, que esto se pone bueno!"],
      intro:{ adivinanzas:"¡Adivinanzas, mi especialidad! Leé bien y pensá, que no son fáciles.", purificar:"¡Hay que ayudar a un villano akumatizado! Con cuentas bien resueltas lo purificamos.", quien:"¡Caso difícil, detective! Leé las pistas con ojos de gato y descubrí quién es.", numeros:"¡Nueve números escondidos! Encontralos en orden, del uno al nueve. Si fallás, ¡todos se esconden otra vez!", error:"¡A abrir bien los ojos de gato! En cada dibujo hay algo que no está bien.", memoria:"¡A buscar parejas! Ojo de gato, Alina.",
              quiz:"¡Preguntas! Ojalá no te pongas nerviosa, yo ya me puse a ronronear.",
              logica:"¡Desafíos de lógica! Fijate bien, que los gatos somos muy astutos." },
      frases:{ ok:["¡Miau-ravilloso, Alina!","¡Eso es! Sos genial.","¡Fantástico! Me impresionaste."],
               mal:["¡Uy, casi! Hasta los gatos fallan un salto. ¡Intentá de nuevo!","Ese no era, pero seguí intentando."],
               fin:["¡Miau-gnífico! ¡Ganaste, Alina!","¡Sos increíble! ¿Jugamos otra vez?"] } },
    { id:"tikki",
      vs:{ elegir:"¿Jugamos juntas o preferís jugar sola?", turnoA:"Ahora te toca a vos, Alina.", turnoP:"Ahora voy yo, con calma.",
        yoOk:["Yo también lo acerté.","Esta me salió bien."], yoMal:["Ay, esta no me salió.","Me equivoqué, no pasa nada."],
        par:["Encontré una pareja.","¡Esta sí!"], nopar:["Ay, no eran iguales.","Casi."],
        ganaA:"¡Ganaste, Alina! Estoy muy contenta por vos.", empate:"¡Empatamos! Qué lindo jugar juntas.",
        ganaP:"Esta vez gané yo, pero lo hiciste muy bien. Jugamos otra vez cuando quieras." }, img:"tikki.png", zoom:1.0, origen:"50% 40%", nombre:"Tikki", emoji:"✨",
      color:"linear-gradient(135deg,#ff7043,#ffcc80)", desc:"Dulce, tierna y sabia",
      pitch:1.25, rate:0.85,
      saludo:"¡Hola, Alina! Me encanta que estemos juntas. ¿A qué querés jugar?",
      menu:["¿A qué jugamos ahora, Alina?","Elegí el que más te guste."],
      intro:{ galletitas:"¡Mis galletitas! Ayudame a contarlas, que no quiero equivocarme.", purificar:"Vamos a ayudar a un villano akumatizado con cuentas, despacito y con cariño.", quien:"Este caso es difícil. Leé cada pista con calma y pensalo todo.", numeros:"Hay números escondidos del uno al nueve. Buscalos en orden y con calma. Si te equivocás, volvemos a empezar.", error:"Mirá cada dibujo con calma y pensá un ratito. Hay algo que no encaja.", memoria:"Vamos a buscar parejas, con calma. Fijate bien en cada carta.",
              quiz:"Te voy a hacer unas preguntas. Pensá tranquila, no hay apuro.",
              logica:"Son desafíos para pensar. Mirá con atención y vas a encontrar la respuesta." },
      frases:{ ok:["¡Muy bien, Alina! ¡Qué lindo acierto!","¡Lo lograste! Estoy muy contenta.","¡Perfecto! Qué bien pensaste."],
               mal:["No pasa nada, Alina. Probá de nuevo, tranquila.","Casi, casi. Mirá otra vez con calma."],
               fin:["¡Estoy muy orgullosa de vos, Alina!","¡Qué bien jugaste! Fue hermoso jugar con vos."] } }
  ];

  // ---------- Utilidades ----------
  const $ = id => document.getElementById(id);
  const r = a => a[Math.floor(Math.random() * a.length)];
  const mezclar = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  let actual = null, vozOn = true, voces = [];

  // Imagen del personaje; si el archivo no existe, muestra el ícono de reemplazo
  function avatar(p){
    return `<div class="pic" style="background:${p.color}">
      <img src="${p.img}" alt="${p.nombre}" style="transform:scale(${p.zoom});transform-origin:${p.origen}"
           onerror="this.parentNode.textContent='${p.emoji}'">
    </div>`;
  }

  // ---------- Voz del celular (no usa internet ni inteligencia artificial) ----------
  const hayVoz = 'speechSynthesis' in window;
  let vozIdx = 0;
  // Puntaje: prefiere voces "naturales" / de Google / de red y acento latino
  function puntaje(v){
    let n = 0;
    if (/natural|neural|online|enhanced|premium/i.test(v.name)) n += 6;
    if (/google/i.test(v.name)) n += 4;
    if (!v.localService) n += 2;
    if (/es[-_]AR/i.test(v.lang)) n += 12;          // acento argentino primero
    else if (/es[-_](UY|419|US|MX|CO|CL)/i.test(v.lang)) n += 4; // acento latino
    else if (/es[-_]ES/i.test(v.lang)) n -= 2;      // acento de España al final
    if (/espeak|compact|festival|mbrola/i.test(v.name)) n -= 15; // las más robóticas
    if (/female|mujer|paulina|helena|sabina|monica|mónica|elena|paloma|camila|dalia|salome|salomé|elvira|lupe|valentina|laura|marisol|ximena/i.test(v.name)) n += 3;
    return n;
  }
  function cargarVoces(){
    voces = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)).sort((a, b) => puntaje(b) - puntaje(a));
    try { const g = localStorage.getItem("vozAlina"); const i = voces.findIndex(v => v.name === g); vozIdx = i >= 0 ? i : 0; } catch(e) { vozIdx = 0; }
  }
  if (hayVoz) { cargarVoces(); speechSynthesis.onvoiceschanged = cargarVoces; }

  let turnoVoz = 0;
  // Cómo se pronuncian mejor algunas palabras en español
  const PRONUNCIA = [[/Cat Noir/g, "Cat Nuar"], [/Ladybug/g, "Leidibag"], [/Tikki/g, "Tiqui"], [/Miau-gnífico/g, "Miau, magnífico"]];
  // Sin voz: la app solo muestra textos y música. Para volver a activar la voz, poné VOZ_ACTIVA = true.
  const VOZ_ACTIVA = false;
  function hablar(texto){
    if (!VOZ_ACTIVA || !vozOn || !hayVoz || !actual) return;
    speechSynthesis.cancel();
    const mi = ++turnoVoz;
    let limpio = texto
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "")
      .replace(/\+/g, " más ").replace(/−/g, " menos ").replace(/×/g, " por ").replace(/=/g, " igual ").replace(/___/g, " ... ");
    PRONUNCIA.forEach(([a, b]) => { limpio = limpio.replace(a, b); });
    // Se parte en frases cortas, con una pausita entre una y otra, para que suene más natural
    const trozos = limpio.match(/[^.!?¡¿,;:…]+[.!?,;:…]*/g) || [limpio];
    const v = voces[vozIdx];
    const hablarTrozo = i => {
      if (mi !== turnoVoz || i >= trozos.length) return;
      const t = trozos[i].trim(); if (!t) return hablarTrozo(i + 1);
      const u = new SpeechSynthesisUtterance(t);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = "es-AR"; }

  function memoria(n){

    const terminar = () => {

      const v = actual.vs;

    function turnoPersonaje(anuncia = true){
      bloqueo = true;

      setTimeout(() => {
        let a = null, b2 = null;
        const vistos = [...recuerdo.entries()].filter(([i]) => libre(i));
        buscar: for (let u = 0; u < vistos.length; u++) for (let v = u + 1; v < vistos.length; v++) {
          if (vistos[u][1] === vistos[v][1]) { a = vistos[u][0]; b2 = vistos[v][0]; break buscar; }
        }
        if (a === null) a = r(cartas.map((_, i) => i).filter(libre));
        abrir(a);
        setTimeout(() => {
          if (b2 === null) {
            const k = cartas[a].k;
            const conocida = [...recuerdo.entries()].find(([i, kk]) => i !== a && kk === k && libre(i));
            b2 = conocida ? conocida[0] : r(cartas.map((_, i) => i).filter(i => i !== a && libre(i)));
          }
          abrir(b2);
          setTimeout(() => {
            if (cartas[a].k === cartas[b2].k) {
              emparejar(a, b2); ptsP++; pintar(); decir(r(actual.vs.par));
              if (hechas === n) return setTimeout(terminar, 1200);
              setTimeout(() => turnoPersonaje(false), 1500);
            } else {
              cerrar(a); cerrar(b2); decir(r(actual.vs.nopar));
              setTimeout(() => { bloqueo = false; decir(actual.vs.turnoA); }, 1400);
            }
          }, 1000);
        }, 900);
      }, 1400);
    }

      b.className = "carta";
      b.innerHTML = `<span class="dorso">${ic("?")}</span><span class="frente">${c.p ? avatar(c.p) : ic(c.e)}</span>`;

  function jugarError(cantidad){
    const orden = mezclar(ESCENAS).slice(0, cantidad);
    const contra = modo === "contra";
    let idx = 0, puntos = 0, ptsP = 0, ficha = 0;
    decir(actual.intro.error, "gBubble", actual.id + "_intro-error");

    function mostrar(){
      const mi = ++ficha, esc = orden[idx];
      let fallos = 0, pista = false, listo = false;
      $("gameBody").innerHTML = `${contra ? `<div class="marcador" id="marc">${spansMarcador(puntos, ptsP)}</div>` : ""}
        <p class="info">Dibujo ${idx + 1} de ${orden.length}</p>
        <p class="q">¿Qué está mal en este dibujo?</p>
        <svg id="lamina" viewBox="0 0 300 300" style="width:100%;max-width:440px;align-self:center;border-radius:18px;touch-action:manipulation;background:#fff">${esc.dibujo()}<g id="marcas"></g></svg>
        <button class="gbtn sec" id="pistaBtn">💡 Pista</button>
        <p class="info" id="expl" style="font-size:1.05rem;min-height:2.6em"></p>
        <button class="gbtn" id="sigBtn" style="display:none">${idx + 1 < orden.length ? "Siguiente →" : "Ver mi resultado"}</button>`;

      const terminar = (acerto) => {
        listo = true;
        $("pistaBtn").style.display = "none";
        $("sigBtn").style.display = "block";
        $("marcas").innerHTML += esc.marca;
        if (acerto && !pista) puntos++;
        $("expl").textContent = esc.explica;
        setTimeout(() => { if (mi === ficha) reproducir(null, esc.explica); }, 1600);
        if (contra) {
          const acertoP = Math.random() < 0.6;
          if (acertoP) ptsP++;
          const linea = r(acertoP ? actual.vs.yoOk : actual.vs.yoMal);
          setTimeout(() => { if (mi !== ficha) return; $("expl").textContent = esc.explica + "  —  " + actual.nombre + ": " + linea; if ($("marc")) $("marc").innerHTML = spansMarcador(puntos, ptsP); }, 4200);
        }
      };

      $("lamina").onclick = ev => {
        if (listo) return;
        const b = $("lamina").getBoundingClientRect();
        const x = (ev.clientX - b.left) / b.width * 300, y = (ev.clientY - b.top) / b.height * 300;
        if (esc.hit(x, y)) { decirDe(actual.frases.ok, "ok"); terminar(true); return; }
        fallos++;
        const m = document.createElementNS("http://www.w3.org/2000/svg", "g");
        m.innerHTML = `<circle cx="${x}" cy="${y}" r="14" fill="none" stroke="#e53935" stroke-width="4"/><line x1="${x - 8}" y1="${y - 8}" x2="${x + 8}" y2="${y + 8}" stroke="#e53935" stroke-width="4"/><line x1="${x + 8}" y1="${y - 8}" x2="${x - 8}" y2="${y + 8}" stroke="#e53935" stroke-width="4"/>`;
        $("marcas").appendChild(m);
        setTimeout(() => m.remove(), 900);
        if (fallos >= 3) { decirDe(actual.frases.mal, "mal"); terminar(false); }
        else decirDe(actual.frases.mal, "mal");
      };
      $("pistaBtn").onclick = () => { pista = true; $("expl").textContent = "💡 " + esc.pista; reproducir(null, esc.pista); };
      $("sigBtn").onclick = () => {
        idx++;
        if (idx < orden.length) return mostrar();
        if (contra) {
          const v = actual.vs;
          const frase = puntos > ptsP ? v.ganaA : puntos < ptsP ? v.ganaP : v.empate;
          const titulo = puntos > ptsP ? "¡Ganaste, Alina!" : puntos < ptsP ? `Ganó ${actual.nombre}` : "¡Empate!";
          final(titulo, `Alina ${puntos} - ${actual.nombre} ${ptsP}`, () => jugarError(cantidad), frase);
        } else final(`¡Terminaste! ${"⭐".repeat(puntos)}`, `Descubriste ${puntos} de ${orden.length} sin pedir pista.`, () => jugarError(cantidad));
      };
    }
    mostrar();
  }

  // ---------- Juego 5: Números escondidos (del 1 al 9, en orden) ----------
  function jugarNumeros(){
    const nums = mezclar([1, 2, 3, 4, 5, 6, 7, 8, 9]); // posición fija durante toda la partida
    let siguiente = 1, intentos = 1, bloqueado = false, mejor = 1;
    decir(actual.intro.numeros, "gBubble", actual.id + "_intro-numeros");
    $("gameBody").innerHTML = `<p class="info" id="nInfo"></p>
      <div class="grid" id="nGrid" style="grid-template-columns:repeat(3,1fr);max-width:380px;width:100%;align-self:center"></div>
      <p class="info" id="nMsg" style="min-height:1.6em"></p>`;
    const g = $("nGrid");
    nums.forEach((n, i) => {
      const b = document.createElement("button");
      b.className = "carta"; b.dataset.n = n;
      b.innerHTML = `<span class="dorso">${ic("?")}</span><span class="frente">${n}</span>`;
      b.onclick = () => tocar(b, n);
      g.appendChild(b);
    });
    const info = () => { $("nInfo").textContent = `Buscá el número ${siguiente} · Intento ${intentos}`; };
    info();
    function tocar(b, n){
      if (bloqueado || b.classList.contains("par")) return;
      if (n === siguiente){
        b.classList.add("par");
        if (siguiente > mejor) mejor = siguiente;
        siguiente++;
        if (siguiente > 9){
          bloqueado = true;
          setTimeout(() => final(`¡Lo lograste! ⭐`, intentos === 1 ? "¡A la primera, sin equivocarte!" : `Lo lograste en ${intentos} intentos.`, jugarNumeros), 900);
          return;
        }
        $("nMsg").textContent = "";
        if (siguiente === 2 || Math.random() < 0.35) decirDe(actual.frases.ok, "ok");
        info();
      } else {
        bloqueado = true;
        b.classList.add("abierta");
        b.style.background = "rgba(229,57,53,.55)";
        $("nMsg").textContent = `Ahí estaba el ${n}. ¡Se esconden todos de nuevo, empezá otra vez desde el 1!`;
        decirDe(actual.frases.mal, "mal");
        setTimeout(() => {
          g.querySelectorAll(".carta").forEach(c => { c.classList.remove("par", "abierta"); c.style.background = ""; });
          siguiente = 1; intentos++; bloqueado = false; $("nMsg").textContent = ""; info();
        }, 1800);
      }
    }
  }

  const villanoHTML = (v, tam) => `<div class="vill" style="width:${tam}px;height:${tam}px;border-radius:50%;background:radial-gradient(circle at 35% 30%, ${v.color}, #14061f);display:grid;place-items:center;overflow:hidden;position:relative;border:3px solid rgba(255,255,255,.35)">

  function jugarPurificar(){
    const orden = mezclar(VILLANOS);
    let vi = 0, aciertos = 0, falladas = 0;
    decir(actual.intro.purificar, "gBubble", actual.id + "_intro-purificar");
    const op = nivel => { // sumas y restas, cada vez un poco más difíciles
      const max = [12, 20, 30, 50][Math.min(nivel, 3)];
      let a, b, res, txt;
      if (Math.random() < 0.5){ a = 2 + Math.floor(Math.random() * (max - 4)); b = 1 + Math.floor(Math.random() * (max - a)); res = a + b; txt = `${a} + ${b}`; }
      else { a = 4 + Math.floor(Math.random() * (max - 3)); b = 1 + Math.floor(Math.random() * (a - 1)); res = a - b; txt = `${a} − ${b}`; }
      const s = new Set([res]);
      for (const d of mezclar([1, -1, 2, -2, 3, 10, -10])){ if (s.size >= 4) break; if (res + d >= 0) s.add(res + d); }
      return { txt, res, ops: mezclar([...s]) };
    };
    function villano(){
      const v = orden[vi]; let paso = 0; const TOT = 3;
      const pintar = () => {
        const q = op(vi);
        const prog = paso / TOT;
        $("gameBody").innerHTML = `<p class="info">Villano ${vi + 1} de ${orden.length} · ${v.nombre}</p>
          <div style="align-self:center;transition:filter .6s;filter:grayscale(${1 - prog}) brightness(${0.55 + 0.45 * prog})">${villanoHTML(v, 130)}</div>
          <div style="height:14px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden"><div style="height:100%;width:${(1 - prog) * 100}%;background:#6a1b9a;transition:width .5s"></div></div>
          <p class="info">Oscuridad: ${TOT - paso} de ${TOT}</p>
          <p class="q" style="font-size:1.8rem">${q.txt} = ?</p>
          <div class="grid" style="grid-template-columns:repeat(2,1fr)">${q.ops.map(o => `<button class="gbtn sec opc" data-v="${o}" style="font-size:1.5rem">${o}</button>`).join("")}</div>

  // ---------- ¿Quién fue? (difícil) ----------
  const COL = [["rojo", "#e53935"], ["azul", "#1e88e5"], ["verde", "#43a047"], ["amarillo", "#fdd835"], ["violeta", "#8e24aa"], ["naranja", "#fb8c00"]];
  function crearCaso(){
    for (let intento = 0; intento < 500; intento++){
      const cols = mezclar(COL.map((c, i) => i));
      const S = cols.map(c => ({ c, sombrero: Math.random() < 0.5, lentes: Math.random() < 0.5 }));
      const n = S.length, cul = Math.floor(Math.random() * n);
      const posDe = c => S.findIndex(s => s.c === c);
      const cand = [];
      cand.push([i => S[i].sombrero, "lleva sombrero"], [i => !S[i].sombrero, "no lleva sombrero"], [i => S[i].lentes, "usa lentes"], [i => !S[i].lentes, "no usa lentes"]);
      COL.forEach(([nom], c) => {
        cand.push([i => S[i].c !== c, `no viste de ${nom}`]);
        cand.push([i => i < posDe(c), `está más a la izquierda que quien viste de ${nom}`]);
        cand.push([i => i > posDe(c), `está más a la derecha que quien viste de ${nom}`]);
        cand.push([i => Math.abs(i - posDe(c)) === 1, `está justo al lado de quien viste de ${nom}`]);
      });
      cand.push([i => i > 0 && i < n - 1, "no está en ninguna de las puntas"], [i => i === 0 || i === n - 1, "está en una de las puntas"]);
      cand.push([i => (i > 0 && S[i - 1].lentes) || (i < n - 1 && S[i + 1].lentes), "tiene al lado a alguien con lentes"]);
      cand.push([i => (i > 0 && S[i - 1].sombrero) || (i < n - 1 && S[i + 1].sombrero), "tiene al lado a alguien con sombrero"]);
      cand.push([i => !((i > 0 && S[i - 1].sombrero) || (i < n - 1 && S[i + 1].sombrero)), "no tiene al lado a nadie con sombrero"]);
      let vivos = S.map((s, i) => i); const pistas = [];
      while (vivos.length > 1){
        const ok = mezclar(cand).filter(([f]) => f(cul)).map(([f, t]) => ({ f, t, rest: vivos.filter(f) })).filter(x => x.rest.length < vivos.length);
        if (!ok.length) break;
        const minimo = Math.min(...ok.map(x => vivos.length - x.rest.length));
        const el = ok.filter(x => vivos.length - x.rest.length === minimo)[0];
        pistas.push(el.t); vivos = el.rest;
      }
      if (vivos.length === 1 && pistas.length >= 4) return { S, cul, pistas: mezclar(pistas) };
    }
    return null;

  function bancoGalletitas(){
    const gal = n => `<span class="carita">${ic("galleta")}</span>`.repeat(n);
    const al = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const dist = res => { const s = new Set([res]); for (const d of mezclar([1, -1, 2, -2, 3, 10, -10])){ if (s.size >= 4) break; if (res + d >= 0) s.add(res + d); } return [...s].filter(x => x !== res).slice(0, 3).map(String); };
    const lista = [];
    for (let i = 0; i < 10; i++){
      const t = i % 4; let it;
      if (t === 0){ const a = al(3, 10), b = al(2, 8); it = { q: `Tikki tiene ${a} galletitas y Alina le regala ${b} más. ¿Cuántas tiene ahora?`, s: `${gal(a)} <b>+</b> ${gal(b)}`, r: a + b }; }
      else if (t === 1){ const a = al(6, 14), b = al(2, a - 2); it = { q: `Tikki tenía ${a} galletitas y se comió ${b}. ¿Cuántas le quedan?`, s: gal(a), r: a - b }; }
      else if (t === 2){ const a = al(3, 9), b = al(3, 9); it = { q: `En un plato hay ${a} galletitas y en otro plato hay ${b}. ¿Cuántas hay en total?`, s: `${gal(a)} | ${gal(b)}`, r: a + b }; }

                const frase = puntos > ptsP ? v.ganaA : puntos < ptsP ? v.ganaP : v.empate;
                const titulo = puntos > ptsP ? "¡Ganaste, Alina!" : puntos < ptsP ? `Ganó ${actual.nombre}` : "¡Empate!";
                final(titulo, `Alina ${puntos} - ${actual.nombre} ${ptsP}`, () => jugarPreguntas(banco, cantidad, tipo), frase);
              }
              else final(`¡Terminaste! ${"⭐".repeat(puntos)}`, `Acertaste ${puntos} de ${items.length} a la primera.`, () => jugarPreguntas(banco, cantidad, tipo));
            }, espera);
          } else {
            primera = false;
            btn.classList.add("no");
            btn.disabled = true;
            decirDe(actual.frases.mal, "mal");
          }
        };
      });
    }
    mostrarPregunta();
  }
</script>
